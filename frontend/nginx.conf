# Sert l'export statique de Next.js (out/). Les routes /api/ et /_reveil sont prises par le proxy d'entrée.
# Base : templates/nginx.conf de la core-platform (en-têtes de sécurité + repli SPA), CSP adaptée :
# localhost:8501 et localhost:9000 retirés (injoignables depuis le navigateur du visiteur), script-src
# ajouté explicitement pour le bundle Next.js (sans lui, la page rend blanc sans erreur serveur).
server {
  listen 80;
  root /usr/share/nginx/html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; frame-ancestors 'none'" always;

  # Contrôles de santé : fichiers statiques public/health et public/sante.
  location ~ ^/(health|sante)$ {
    default_type text/plain;
  }

  # Bundles Next.js hachés (_next/static/...) : immuables, cache long.
  location /_next/static/ {
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; frame-ancestors 'none'" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Chaque route (ou son repli) : on sert le fichier, le dossier (index.html dedans), sinon l'accueil.
  location / {
    try_files $uri $uri.html $uri/ /index.html;
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
  }
}
